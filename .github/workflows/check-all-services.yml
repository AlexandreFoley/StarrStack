name: Check All Services for Updates

on:
  schedule:
    # Check for new releases weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    env:
      CHECK_FUNCTION: |
        check_service() {
          local NAME=$1
          local URL=$2
          local LAST_CHECK=$3
          RELEASE=$(curl -s "$URL")
          LATEST=$(echo "$RELEASE" | jq -r '.tag_name | gsub("^v"; "")')
          PUBLISHED=$(echo "$RELEASE" | jq -r '.published_at')
          
          echo "latest-version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "published-at=$PUBLISHED" >> "$GITHUB_OUTPUT"
          
          if [[ "$PUBLISHED" > "$LAST_CHECK" ]]; then
            echo "needs-update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-update=false" >> "$GITHUB_OUTPUT"
            echo "$NAME $LATEST is older than last check"
          fi
          echo "$NAME $LATEST (published: $PUBLISHED)"
        }
    outputs:
      radarr-version: ${{ steps.check-radarr.outputs.latest-version }}
      radarr-update: ${{ steps.check-radarr.outputs.needs-update }}
      sonarr-version: ${{ steps.check-sonarr.outputs.latest-version }}
      sonarr-update: ${{ steps.check-sonarr.outputs.needs-update }}
      prowlarr-version: ${{ steps.check-prowlarr.outputs.latest-version }}
      prowlarr-update: ${{ steps.check-prowlarr.outputs.needs-update }}
      unpackerr-version: ${{ steps.check-unpackerr.outputs.latest-version }}
      unpackerr-update: ${{ steps.check-unpackerr.outputs.needs-update }}
      any-updates: ${{ steps.summary.outputs.any-updates }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Calculate check window
        id: window
        run: |
          # Last check was 7 days ago (one week before now)
          LAST_CHECK=$(date -u -d "7 days ago" -Iseconds)
          echo "last-check=$LAST_CHECK" >> "$GITHUB_OUTPUT"
          echo "Checking for updates published after: $LAST_CHECK"

      - name: Check Radarr
        id: check-radarr
        run: |
          ${{ env.CHECK_FUNCTION }}
          check_service "Radarr" "https://api.github.com/repos/Radarr/Radarr/releases/latest" "${{ steps.window.outputs.last-check }}"

      - name: Check Sonarr
        id: check-sonarr
        run: |
          ${{ env.CHECK_FUNCTION }}
          check_service "Sonarr" "https://api.github.com/repos/Sonarr/Sonarr/releases/latest" "${{ steps.window.outputs.last-check }}"

      - name: Check Prowlarr
        id: check-prowlarr
        run: |
          ${{ env.CHECK_FUNCTION }}
          check_service "Prowlarr" "https://api.github.com/repos/Prowlarr/Prowlarr/releases/latest" "${{ steps.window.outputs.last-check }}"

      - name: Check Unpackerr
        id: check-unpackerr
        run: |
          ${{ env.CHECK_FUNCTION }}
          check_service "Unpackerr" "https://api.github.com/repositories/132426524/releases/latest" "${{ steps.window.outputs.last-check }}"

      - name: Summarize updates
        id: summary
        run: |
          set -euo pipefail

          any=false
          updates=()

          if [[ "${{ steps.check-radarr.outputs.needs-update }}" == "true" ]]; then
            any=true
            updates+=("  - Radarr: ${{ steps.check-radarr.outputs.latest-version }}")
          fi
          if [[ "${{ steps.check-sonarr.outputs.needs-update }}" == "true" ]]; then
            any=true
            updates+=("  - Sonarr: ${{ steps.check-sonarr.outputs.latest-version }}")
          fi
          if [[ "${{ steps.check-prowlarr.outputs.needs-update }}" == "true" ]]; then
            any=true
            updates+=("  - Prowlarr: ${{ steps.check-prowlarr.outputs.latest-version }}")
          fi
          if [[ "${{ steps.check-unpackerr.outputs.needs-update }}" == "true" ]]; then
            any=true
            updates+=("  - Unpackerr: ${{ steps.check-unpackerr.outputs.latest-version }}")
          fi

          echo "any-updates=$any" >> "$GITHUB_OUTPUT"

          if [[ "$any" == "true" ]]; then
            echo "Updates available:"
            printf '%s\n' "${updates[@]}"
          else
            echo "All services are up to date"
          fi

  trigger-build:
    needs: check-all
    if: needs.check-all.outputs.any-updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger build workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RADARR_UPDATE: ${{ needs.check-all.outputs.radarr-update }}
          RADARR_VERSION: ${{ needs.check-all.outputs.radarr-version }}
          SONARR_UPDATE: ${{ needs.check-all.outputs.sonarr-update }}
          SONARR_VERSION: ${{ needs.check-all.outputs.sonarr-version }}
          PROWLARR_UPDATE: ${{ needs.check-all.outputs.prowlarr-update }}
          PROWLARR_VERSION: ${{ needs.check-all.outputs.prowlarr-version }}
          UNPACKERR_UPDATE: ${{ needs.check-all.outputs.unpackerr-update }}
          UNPACKERR_VERSION: ${{ needs.check-all.outputs.unpackerr-version }}
        with:
          script: |
            const inputs = { push: 'true' };
            
            if (process.env.RADARR_UPDATE === 'true') {
              inputs.radarr_version = process.env.RADARR_VERSION;
            }
            if (process.env.SONARR_UPDATE === 'true') {
              inputs.sonarr_version = process.env.SONARR_VERSION;
            }
            if (process.env.PROWLARR_UPDATE === 'true') {
              inputs.prowlarr_version = process.env.PROWLARR_VERSION;
            }
            if (process.env.UNPACKERR_UPDATE === 'true') {
              inputs.unpackerr_version = process.env.UNPACKERR_VERSION;
            }
            
            console.log('Triggering build with inputs:', inputs);
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: inputs
            });

