name: Check All Services for Updates

on:
  schedule:
    # Check for new releases weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-latest
    outputs:
      radarr-version: ${{ steps.check-radarr.outputs.latest-version }}
      radarr-update: ${{ steps.check-radarr.outputs.needs-update }}
      sonarr-version: ${{ steps.check-sonarr.outputs.latest-version }}
      sonarr-update: ${{ steps.check-sonarr.outputs.needs-update }}
      prowlarr-version: ${{ steps.check-prowlarr.outputs.latest-version }}
      prowlarr-update: ${{ steps.check-prowlarr.outputs.needs-update }}
      unpackerr-version: ${{ steps.check-unpackerr.outputs.latest-version }}
      unpackerr-update: ${{ steps.check-unpackerr.outputs.needs-update }}
      any-updates: ${{ steps.summary.outputs.any-updates }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Calculate check window
        id: window
        run: |
          # Last check was 7 days ago (one week before now)
          LAST_CHECK=$(date -u -d "7 days ago" -Iseconds)
          echo "last-check=$LAST_CHECK" >> "$GITHUB_OUTPUT"
          echo "Checking for updates published after: $LAST_CHECK"

      - name: Check Radarr
        id: check-radarr
        env:
          LAST_CHECK: ${{ steps.window.outputs.last-check }}
        run: |
          bash .github/scripts/check-service.sh \
            "Radarr" "https://api.github.com/repos/Radarr/Radarr/releases/latest" "$LAST_CHECK"

      - name: Check Sonarr
        id: check-sonarr
        env:
          LAST_CHECK: ${{ steps.window.outputs.last-check }}
        run: |
          bash .github/scripts/check-service.sh \
            "Sonarr" "https://api.github.com/repos/Sonarr/Sonarr/releases/latest" "$LAST_CHECK"

      - name: Check Prowlarr
        id: check-prowlarr
        env:
          LAST_CHECK: ${{ steps.window.outputs.last-check }}
        run: |
          bash .github/scripts/check-service.sh \
            "Prowlarr" "https://api.github.com/repos/Prowlarr/Prowlarr/releases/latest" "$LAST_CHECK"

      - name: Check Unpackerr
        id: check-unpackerr
        env:
          LAST_CHECK: ${{ steps.window.outputs.last-check }}
        run: |
          bash .github/scripts/check-service.sh \
            "Unpackerr" "https://api.github.com/repositories/132426524/releases/latest" "$LAST_CHECK"

      - name: Summarize updates
        id: summary
        env:
          RADARR_UPDATE: ${{ steps.check-radarr.outputs.needs-update }}
          RADARR_VERSION: ${{ steps.check-radarr.outputs.latest-version }}
          SONARR_UPDATE: ${{ steps.check-sonarr.outputs.needs-update }}
          SONARR_VERSION: ${{ steps.check-sonarr.outputs.latest-version }}
          PROWLARR_UPDATE: ${{ steps.check-prowlarr.outputs.needs-update }}
          PROWLARR_VERSION: ${{ steps.check-prowlarr.outputs.latest-version }}
          UNPACKERR_UPDATE: ${{ steps.check-unpackerr.outputs.needs-update }}
          UNPACKERR_VERSION: ${{ steps.check-unpackerr.outputs.latest-version }}
        run: |
          set -euo pipefail

          any=false
          updates=()

          if [[ "$RADARR_UPDATE" == "true" ]]; then
            any=true
            updates+=("  - Radarr: $RADARR_VERSION")
          fi
          if [[ "$SONARR_UPDATE" == "true" ]]; then
            any=true
            updates+=("  - Sonarr: $SONARR_VERSION")
          fi
          if [[ "$PROWLARR_UPDATE" == "true" ]]; then
            any=true
            updates+=("  - Prowlarr: $PROWLARR_VERSION")
          fi
          if [[ "$UNPACKERR_UPDATE" == "true" ]]; then
            any=true
            updates+=("  - Unpackerr: $UNPACKERR_VERSION")
          fi

          echo "any-updates=$any" >> "$GITHUB_OUTPUT"

          if [[ "$any" == "true" ]]; then
            echo "Updates available:"
            printf '%s\n' "${updates[@]}"
          else
            echo "All services are up to date"
          fi

  trigger-build:
    needs: check-all
    if: needs.check-all.outputs.any-updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger build workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RADARR_UPDATE: ${{ needs.check-all.outputs.radarr-update }}
          RADARR_VERSION: ${{ needs.check-all.outputs.radarr-version }}
          SONARR_UPDATE: ${{ needs.check-all.outputs.sonarr-update }}
          SONARR_VERSION: ${{ needs.check-all.outputs.sonarr-version }}
          PROWLARR_UPDATE: ${{ needs.check-all.outputs.prowlarr-update }}
          PROWLARR_VERSION: ${{ needs.check-all.outputs.prowlarr-version }}
          UNPACKERR_UPDATE: ${{ needs.check-all.outputs.unpackerr-update }}
          UNPACKERR_VERSION: ${{ needs.check-all.outputs.unpackerr-version }}
        with:
          script: |
            const inputs = { push: 'true' };
            
            if (process.env.RADARR_UPDATE === 'true') {
              inputs.radarr_version = process.env.RADARR_VERSION;
            }
            if (process.env.SONARR_UPDATE === 'true') {
              inputs.sonarr_version = process.env.SONARR_VERSION;
            }
            if (process.env.PROWLARR_UPDATE === 'true') {
              inputs.prowlarr_version = process.env.PROWLARR_VERSION;
            }
            if (process.env.UNPACKERR_UPDATE === 'true') {
              inputs.unpackerr_version = process.env.UNPACKERR_VERSION;
            }
            
            console.log('Triggering build with inputs:', inputs);
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: inputs
            });

