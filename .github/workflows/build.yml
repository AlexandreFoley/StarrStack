name: Build and Publish Container Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry (true/false)'
        required: false
        default: 'false'
      radarr_version:
        description: 'Radarr version (from check workflow)'
        required: false
      sonarr_version:
        description: 'Sonarr version (from check workflow)'
        required: false
      prowlarr_version:
        description: 'Prowlarr version (from check workflow)'
        required: false
      unpackerr_version:
        description: 'Unpackerr version (from check workflow)'
        required: false
permissions:
  contents: read
  packages: read
jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      radarr: ${{ steps.versions.outputs.radarr }}
      sonarr: ${{ steps.versions.outputs.sonarr }}
      prowlarr: ${{ steps.versions.outputs.prowlarr }}
      unpackerr: ${{ steps.versions.outputs.unpackerr }}
      repo_lower: ${{ steps.repo.outputs.repo_lower }}
    steps:
      - name: Fetch latest versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADARR_VERSION_INPUT: ${{ github.event.inputs.radarr_version }}
          SONARR_VERSION_INPUT: ${{ github.event.inputs.sonarr_version }}
          PROWLARR_VERSION_INPUT: ${{ github.event.inputs.prowlarr_version }}
          UNPACKERR_VERSION_INPUT: ${{ github.event.inputs.unpackerr_version }}
        run: |
          set -euo pipefail

          validate_version() {
            local name="$1"
            local version="$2"
            if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid ${name} version: ${version}" >&2
              exit 1
            fi
          }

          # Use provided inputs if available, otherwise fetch latest
          echo "Build versions:"
          if [ -n "$RADARR_VERSION_INPUT" ]; then
            RADARR="$RADARR_VERSION_INPUT"
          else
            RADARR=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Radarr/Radarr/releases/latest | jq -r '.tag_name | gsub("^v"; "")')
          fi
          validate_version "Radarr" "$RADARR"
          echo "  Radarr: $RADARR"
          
          if [ -n "$SONARR_VERSION_INPUT" ]; then
            SONARR="$SONARR_VERSION_INPUT"
          else
            SONARR=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Sonarr/Sonarr/releases/latest | jq -r '.tag_name | gsub("^v"; "")')
          fi
          validate_version "Sonarr" "$SONARR"
          echo "  Sonarr: $SONARR"
          
          if [ -n "$PROWLARR_VERSION_INPUT" ]; then
            PROWLARR="$PROWLARR_VERSION_INPUT"
          else
            PROWLARR=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Prowlarr/Prowlarr/releases/latest | jq -r '.tag_name | gsub("^v"; "")')
          fi
          validate_version "Prowlarr" "$PROWLARR"
          echo "  Prowlarr: $PROWLARR"
          
          if [ -n "$UNPACKERR_VERSION_INPUT" ]; then
            UNPACKERR="$UNPACKERR_VERSION_INPUT"
          else
            UNPACKERR=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repositories/132426524/releases/latest | jq -r '.tag_name | gsub("^v"; "")')
          fi
          validate_version "Unpackerr" "$UNPACKERR"
          echo "  Unpackerr: $UNPACKERR"
          
          {
            echo "radarr=$RADARR"
            echo "sonarr=$SONARR"
            echo "prowlarr=$PROWLARR"
            echo "unpackerr=$UNPACKERR"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase repository name
        id: repo
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AMD64 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./ubi.dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: starrstack-test-amd64:${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            RADARR_VERSION=${{ needs.versions.outputs.radarr }}
            SONARR_VERSION=${{ needs.versions.outputs.sonarr }}
            PROWLARR_VERSION=${{ needs.versions.outputs.prowlarr }}
            UNPACKERR_VERSION=${{ needs.versions.outputs.unpackerr }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Push AMD64 image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        env:
          IMAGE_SHA: ${{ github.sha }}
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
        run: |
          image="ghcr.io/${REPO_LOWER}:${IMAGE_SHA}-amd64"
          docker tag "starrstack-test-amd64:${IMAGE_SHA}" "$image"
          docker push "$image"

  build-arm64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    outputs:
      success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./ubi.dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: starrstack-test-arm64:${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            RADARR_VERSION=${{ needs.versions.outputs.radarr }}
            SONARR_VERSION=${{ needs.versions.outputs.sonarr }}
            PROWLARR_VERSION=${{ needs.versions.outputs.prowlarr }}
            UNPACKERR_VERSION=${{ needs.versions.outputs.unpackerr }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Push ARM64 image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        env:
          IMAGE_SHA: ${{ github.sha }}
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
        run: |
          image="ghcr.io/${REPO_LOWER}:${IMAGE_SHA}-arm64"
          docker tag "starrstack-test-arm64:${IMAGE_SHA}" "$image"
          docker push "$image"


  build-alpine-amd64:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine AMD64 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./alpine.dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: starrstack-test-alpine-amd64:${{ github.sha }}
          cache-from: type=gha,scope=alpine-amd64
          cache-to: type=gha,mode=max,scope=alpine-amd64
          build-args: |
            RADARR_VERSION=${{ needs.versions.outputs.radarr }}
            SONARR_VERSION=${{ needs.versions.outputs.sonarr }}
            PROWLARR_VERSION=${{ needs.versions.outputs.prowlarr }}
            UNPACKERR_VERSION=${{ needs.versions.outputs.unpackerr }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Push Alpine AMD64 image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        env:
          IMAGE_SHA: ${{ github.sha }}
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
        run: |
          image="ghcr.io/${REPO_LOWER}:${IMAGE_SHA}-alpine-amd64"
          docker tag "starrstack-test-alpine-amd64:${IMAGE_SHA}" "$image"
          docker push "$image"

  build-alpine-arm64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    outputs:
      success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine ARM64 image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./alpine.dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: starrstack-test-alpine-arm64:${{ github.sha }}
          cache-from: type=gha,scope=alpine-arm64
          cache-to: type=gha,mode=max,scope=alpine-arm64
          build-args: |
            RADARR_VERSION=${{ needs.versions.outputs.radarr }}
            SONARR_VERSION=${{ needs.versions.outputs.sonarr }}
            PROWLARR_VERSION=${{ needs.versions.outputs.prowlarr }}
            UNPACKERR_VERSION=${{ needs.versions.outputs.unpackerr }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Push Alpine ARM64 image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
        env:
          IMAGE_SHA: ${{ github.sha }}
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
        run: |
          image="ghcr.io/${REPO_LOWER}:${IMAGE_SHA}-alpine-arm64"
          docker tag "starrstack-test-alpine-arm64:${IMAGE_SHA}" "$image"
          docker push "$image"

  manifest:
    needs: [versions, build-amd64, build-arm64, build-alpine-amd64, build-alpine-arm64]
    runs-on: ubuntu-latest
    if: always() && needs.build-amd64.result == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
          IMAGE_SHA: ${{ github.sha }}
          RADARR_VERSION: ${{ needs.versions.outputs.radarr }}
          SONARR_VERSION: ${{ needs.versions.outputs.sonarr }}
          PROWLARR_VERSION: ${{ needs.versions.outputs.prowlarr }}
          UNPACKERR_VERSION: ${{ needs.versions.outputs.unpackerr }}
          ARM64_SUCCESS: ${{ needs.build-arm64.outputs.success }}
        run: |
          repo="ghcr.io/${REPO_LOWER}"
          sha="${IMAGE_SHA}"
          radarr="${RADARR_VERSION}"
          sonarr="${SONARR_VERSION}"
          prowlarr="${PROWLARR_VERSION}"
          unpackerr="${UNPACKERR_VERSION}"

          # Determine which images to include in manifest
          IMAGES=("${repo}:${sha}-amd64")
          
          if [ "$ARM64_SUCCESS" == "true" ]; then
            IMAGES+=("${repo}:${sha}-arm64")
            echo "Including both AMD64 and ARM64 in manifest"
          else
            echo "ARM64 build failed or was skipped, creating AMD64-only manifest"
          fi
          
          # Create manifest for SHA tag
          docker buildx imagetools create -t "${repo}:${sha}" "${IMAGES[@]}"
          
          # Create manifest for version tag
          docker buildx imagetools create -t "${repo}:radarr-${radarr}-sonarr-${sonarr}-prowlarr-${prowlarr}-unpackerr-${unpackerr}" "${IMAGES[@]}"
          
          # Create manifest for latest tag
          docker buildx imagetools create -t "${repo}:latest" "${IMAGES[@]}"


      - name: Create and push alpine multi-arch manifest
        if: needs.build-alpine-amd64.result == 'success'
        env:
          REPO_LOWER: ${{ needs.versions.outputs.repo_lower }}
          IMAGE_SHA: ${{ github.sha }}
          RADARR_VERSION: ${{ needs.versions.outputs.radarr }}
          SONARR_VERSION: ${{ needs.versions.outputs.sonarr }}
          PROWLARR_VERSION: ${{ needs.versions.outputs.prowlarr }}
          UNPACKERR_VERSION: ${{ needs.versions.outputs.unpackerr }}
          ARM64_SUCCESS: ${{ needs.build-alpine-arm64.outputs.success }}
        run: |
          repo="ghcr.io/${REPO_LOWER}"
          sha="${IMAGE_SHA}"
          radarr="${RADARR_VERSION}"
          sonarr="${SONARR_VERSION}"
          prowlarr="${PROWLARR_VERSION}"
          unpackerr="${UNPACKERR_VERSION}"
          ALPINE_IMAGES=("${repo}:${sha}-alpine-amd64")

          if [ "$ARM64_SUCCESS" == "true" ]; then
            ALPINE_IMAGES+=("${repo}:${sha}-alpine-arm64")
            echo "Including both AMD64 and ARM64 in alpine manifest"
          else
            echo "Alpine ARM64 build failed or was skipped, creating AMD64-only alpine manifest"
          fi

          docker buildx imagetools create -t "${repo}:${sha}-alpine" "${ALPINE_IMAGES[@]}"
          docker buildx imagetools create -t "${repo}:radarr-${radarr}-sonarr-${sonarr}-prowlarr-${prowlarr}-unpackerr-${unpackerr}-alpine" "${ALPINE_IMAGES[@]}"
          docker buildx imagetools create -t "${repo}:alpine" "${ALPINE_IMAGES[@]}"

  release:
    needs: [versions, manifest, build-arm64, build-alpine-amd64, build-alpine-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: radarr-${{ needs.versions.outputs.radarr }}-sonarr-${{ needs.versions.outputs.sonarr }}-prowlarr-${{ needs.versions.outputs.prowlarr }}-unpackerr-${{ needs.versions.outputs.unpackerr }}
          name: Radarr ${{ needs.versions.outputs.radarr }} / Sonarr ${{ needs.versions.outputs.sonarr }} / Prowlarr ${{ needs.versions.outputs.prowlarr }} / Unpackerr ${{ needs.versions.outputs.unpackerr }}
          body: |
            ## Service Versions
            - **Radarr**: ${{ needs.versions.outputs.radarr }}
            - **Sonarr**: ${{ needs.versions.outputs.sonarr }}
            - **Prowlarr**: ${{ needs.versions.outputs.prowlarr }}
            - **Unpackerr**: ${{ needs.versions.outputs.unpackerr }}
            
            ### Image
            - Registry: `ghcr.io/${{ needs.versions.outputs.repo_lower }}`
            - Tag: `radarr-${{ needs.versions.outputs.radarr }}-sonarr-${{ needs.versions.outputs.sonarr }}-prowlarr-${{ needs.versions.outputs.prowlarr }}-unpackerr-${{ needs.versions.outputs.unpackerr }}`
            - **Alpine**: `ghcr.io/${{ needs.versions.outputs.repo_lower }}:alpine` (same versions, OpenRC-based, ~25% smaller)
            - Latest Build: `${{ github.run_number }}`
            - Latest SHA: `${{ github.sha }}`
            - Architectures: ${{ needs.build-arm64.outputs.success == 'true' && 'AMD64, ARM64' || 'AMD64 only (ARM64 build failed)' }}
            
            _This release is updated automatically when rebuilding with the same service versions._
          draft: false
          prerelease: false
